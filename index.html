<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Santee Open Hours</title>
  <style>
    body {
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
      margin:0; padding:12px;
      font-size:16px;
    }
    .open-box {
      display:inline-block;
      padding:8px 12px;
      border-radius:8px;
      background:#f7f7f7;
      border:1px solid #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="open-box" id="open-hours">Loading...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <script>
    const LAT = 33.088221;
    const LON = -79.467239;
    const TZ  = 'America/New_York';

    const today = new Date();
    const times = SunCalc.getTimes(today, LAT, LON);

    // 30 minutes before sunrise / after sunset
    const openTime = new Date(times.sunrise.getTime() - 30*60*1000);
    const closeTime = new Date(times.sunset.getTime() + 30*60*1000);

    // Format in correct timezone
    function formatInTZ(dateObj, timeZone) {
      return dateObj.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true,
        timeZone: timeZone
      });
    }

    document.getElementById('open-hours').textContent =
      "Opening Hours Today: " + formatInTZ(openTime, TZ) + " → " + formatInTZ(closeTime, TZ);
  </script>
</body>
</html>
